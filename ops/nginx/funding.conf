# funding-tool — nginx site config.
#
# Coexists with the existing FutuBinance site on the same host. Pick a
# dedicated server_name. The public origin set in /etc/funding-tool/web.env
# (FUNDING_PUBLIC_ORIGIN) MUST match the server_name below, otherwise CSRF
# Origin/Referer checks will reject all writes.
#
# Layout served at https://funding.example.com/funding/ :
#   /funding/api/   → reverse proxy to FastAPI on 127.0.0.1:8001 (Path /api/...)
#   /funding/       → Vite build artifacts in /opt/funding-tool/frontend/dist/

# 80 → 308 to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name funding.example.com;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name funding.example.com;

    ssl_certificate     /etc/letsencrypt/live/funding.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/funding.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS — preload requires registering this host with the HSTS preload list.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Request payload cap — JSON requests are tiny; refuse anything larger.
    client_max_body_size 256k;

    # Gzip (FastAPI is not configured with GZipMiddleware, so nginx handles it).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # API reverse proxy — matched before the generic /funding/ static block.
    location /funding/api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # History endpoint may run 30-60 s end-to-end while polling Binance;
        # give the upstream a generous timeout window.
        proxy_read_timeout 320s;
        proxy_send_timeout 320s;
        proxy_buffering off;
    }

    # Static assets (Vite build output) + SPA fallback.
    location /funding/ {
        alias /opt/funding-tool/frontend/dist/;
        index index.html;
        try_files $uri $uri/ /funding/index.html;

        # Vite-hashed assets — immutable, cache 30d.
        location ~* /funding/assets/.*\.(?:js|css|woff2?|png|jpg|svg)$ {
            access_log off;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }
        # index.html must never be cached — fresh hash references every deploy.
        location = /funding/index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }
    }
}
